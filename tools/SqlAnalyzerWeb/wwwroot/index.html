<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T-SQL Analyzer demo</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f3f6fb; color: #1e293b; line-height: 1.5; }
  a { color: #1d4ed8; text-underline-offset: .2em; }
  a:hover { color: #1e40af; }
  header { background: linear-gradient(120deg, #0f172a, #1e3a5f); color: #fff; padding: 2.5rem 1.5rem; }
  .header-content { max-width: 1100px; margin: auto; }
  h1 { margin: 0; font-size: clamp(1.75rem, 4vw, 2.5rem); letter-spacing: -.04em; }
  header p { margin: .5rem 0 1rem; color: #cbd5e1; }
  header a { color: #bfdbfe; font-size: .9rem; }
  header a:hover { color: #fff; }
  main { max-width: 1150px; margin: 1.5rem auto 3rem; padding: 0 1.5rem; }
  .card { background: #fff; border: 1px solid #dbe3ef; border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 16px #0f172a06; }
  .editor-heading { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; flex-wrap: wrap; margin-bottom: .75rem; }
  .editor-heading label { font-weight: 650; font-size: 1.1rem; }
  .hint { color: #64748b; font-size: .85rem; }
  textarea { display: block; width: 100%; height: 300px; min-height: 180px; resize: vertical; font: 14px/1.7 ui-monospace, Consolas, monospace; background: #f8fafc; color: #1e293b; border: 1px solid #cbd5e1; border-radius: 8px; padding: 1rem; tab-size: 4; }
  .bar { display: flex; gap: 1rem; align-items: end; margin-top: 1.25rem; flex-wrap: wrap; }
  button { min-height: 42px; padding: .55rem 1.5rem; border: 1px solid #1d4ed8; border-radius: 6px; background: #1d4ed8; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover:not(:disabled) { background: #1e40af; }
  button:disabled { opacity: .6; cursor: wait; }
  :is(a, textarea, button):focus-visible { outline: 3px solid #60a5fa; outline-offset: 3px; }
  #status { display: block; margin-top: .75rem; color: #64748b; font-size: .9rem; }
  #status:empty, #out:empty { display: none; }
  #out { margin-top: 1.5rem; }
  .results-heading { margin: 0 0 1rem; font-size: 1.1rem; font-weight: 650; }
  .table-wrap { overflow-x: auto; border: 1px solid #dbe3ef; border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { padding: .85rem 1rem; text-align: left; vertical-align: top; }
  th { background: #f1f5f9; color: #475569; font-size: .8rem; }
  td { border-top: 1px solid #e2e8f0; }
  tbody tr:nth-child(even) { background: #f8fafc; }
  tbody tr:hover { background: #eff6ff; }
  td:first-child { white-space: nowrap; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; }
  td:last-child { min-width: 220px; overflow-wrap: anywhere; }
  .err { color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: .75rem 1rem; overflow-wrap: anywhere; }
  @media (max-width: 600px) {
    header { padding: 1.75rem 1rem; }
    main { padding: 0 1rem; margin-top: 1rem; }
    .card { padding: 1rem; }
    .bar { align-items: stretch; }
    .bar button { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="header-content">
    <h1>T-SQL Analyzer demo</h1>
    <p>Find design, naming, and performance issues in your SQL.</p>
    <a href="https://github.com/ErikEJ/SqlServer.Rules">View on GitHub</a>
  </div>
</header>
<main>
  <section class="card" aria-labelledby="script-label">
  <div class="editor-heading">
    <label id="script-label" for="script">T-SQL script</label>
    <span class="hint" id="script-hint">Analyzed only. Never executed or stored.</span>
  </div>
  <textarea id="script" aria-describedby="script-hint" spellcheck="false">CREATE PROCEDURE dbo.GetOrders
AS
BEGIN
    SELECT * FROM Orders WHERE CustomerId = 1
    SET ROWCOUNT 10
END</textarea>
  <div class="bar">
    <button id="run">Analyze</button>
  </div>
  <span id="status" role="status"></span>
  </section>
  <section id="out" class="card" aria-label="Analysis results" aria-live="polite"></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('run').onclick = async () => {
  $('status').textContent = 'Analyzing... (first request may be slow on a cold start)';
  $('out').innerHTML = '';
  $('run').disabled = true;
  try {
    const r = await fetch('api/analyze', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({script: $('script').value})
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $('out').innerHTML = `<p class="err">${esc(d.error || 'Request failed (' + r.status + ')')}</p>`; return; }
    let html = '';
    [...d.modelErrors, ...d.errors].forEach(e => html += `<p class="err">${esc(e)}</p>`);
    html += `<h2 class="results-heading">${d.problems.length} ${d.problems.length === 1 ? 'finding' : 'findings'}</h2>`;
    if (d.problems.length) {
      html += '<div class="table-wrap" tabindex="0" role="region" aria-label="Findings"><table><thead><tr><th scope="col">Rule</th><th scope="col">Line</th><th scope="col">Col</th><th scope="col">Description</th></tr></thead><tbody>';
      d.problems.forEach(p => {
        const docsLink = p.description.match(/\s+\((https:\/\/[^)]+)\)$/);
        const description = docsLink ? p.description.slice(0, docsLink.index) : p.description;
        const helpLink = p.helpLink || docsLink?.[1];
        const rule = helpLink ? `<a href="${esc(helpLink)}" target="_blank" rel="noopener">${esc(p.rule)}</a>` : esc(p.rule);
        html += `<tr><td>${rule}</td><td>${p.line}</td><td>${p.column}</td><td>${esc(description)}</td></tr>`;
      });
      html += '</tbody></table></div>';
    }
    $('out').innerHTML = html;
  } catch (e) {
    $('out').innerHTML = `<p class="err">${esc(e.message)}</p>`;
  } finally {
    $('status').textContent = ''; $('run').disabled = false;
  }
};
</script>
</body>
</html>
