name: Demo web app image

on:
  push:
    branches: [master]
    paths:
      - 'tools/SqlAnalyzerWeb/**'
      - 'tools/ErikEJ.DacFX.TSQLAnalyzer/**'
      - '.github/workflows/web-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build web app
        run: dotnet build tools/SqlAnalyzerWeb/SqlAnalyzerWeb.csproj -c Release

      - name: Normalize image owner
        id: image
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/SqlAnalyzerWeb/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/tsql-analyzer-demo:latest
